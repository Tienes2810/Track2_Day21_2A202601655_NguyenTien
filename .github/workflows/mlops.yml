name: MLOps Pipeline

on:
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'src/**'
      - 'params.yaml'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:

  # ---------------------------------------------------------------------------
  # JOB 1 - UNIT TEST
  # Chay unit tests tren du lieu ao (khong can ket noi cloud storage).
  # Neu co bat ky test nao that bai, pipeline dung lai o day va khong tien hanh
  # huan luyen hay trien khai.
  # ---------------------------------------------------------------------------
  test:
    name: Unit Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: pytest tests/ -v


  # ---------------------------------------------------------------------------
  # JOB 2 - TRAIN
  # Xac thuc cloud storage, pull du lieu bang DVC, huan luyen mo hinh, upload artifact.
  # Chi chay khi Job 1 (Unit Test) hoan thanh thanh cong.
  # ---------------------------------------------------------------------------
  train:
    name: Train
    needs: test
    runs-on: ubuntu-latest
    outputs:
      accuracy: ${{ steps.read_metrics.outputs.accuracy }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Authenticate to Cloud Storage
        run: |
          echo '${{ secrets.CLOUD_CREDENTIALS }}' > /tmp/cloud-creds.json
          python - <<'EOF'
          import json
          import os

          with open("/tmp/cloud-creds.json") as f:
              creds = json.load(f)

          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write(f"AWS_ACCESS_KEY_ID={creds['aws_access_key_id']}\n")
              env.write(f"AWS_SECRET_ACCESS_KEY={creds['aws_secret_access_key']}\n")
              env.write(f"AWS_DEFAULT_REGION={creds.get('region', 'us-east-1')}\n")
              env.write(f"CLOUD_BUCKET={os.environ['BUCKET_SECRET']}\n")
              env.write(f"S3_BUCKET={os.environ['BUCKET_SECRET']}\n")
          EOF
        env:
          BUCKET_SECRET: ${{ secrets.CLOUD_BUCKET }}

      - name: Pull data with DVC
        run: dvc pull data/train_phase1.csv.dvc data/eval.csv.dvc

      - name: Train model
        run: python src/train.py
        env:
          MLFLOW_TRACKING_URI: sqlite:///mlflow.db
          MLFLOW_ARTIFACT_ROOT: ./mlartifacts

      - name: Read metrics
        id: read_metrics
        run: |
          ACC=$(python -c "import json; print(json.load(open('outputs/metrics.json'))['accuracy'])")
          echo "accuracy=$ACC" >> "$GITHUB_OUTPUT"
          echo "Train accuracy=$ACC"

      - name: Upload model to Cloud Storage
        run: |
          python - <<'EOF'
          import os
          import boto3

          bucket = os.environ["CLOUD_BUCKET"]
          s3 = boto3.client("s3", region_name=os.environ.get("AWS_DEFAULT_REGION", "us-east-1"))
          s3.upload_file("models/model.pkl", bucket, "models/latest/model.pkl")
          if os.path.exists("outputs/metrics.json"):
              s3.upload_file("outputs/metrics.json", bucket, "models/latest/metrics.json")
          print(f"Uploaded model to s3://{bucket}/models/latest/model.pkl")
          EOF

      - name: Save metrics as artifact
        uses: actions/upload-artifact@v4
        with:
          name: metrics
          path: |
            outputs/metrics.json
            outputs/report.txt


  # ---------------------------------------------------------------------------
  # JOB 3 - EVAL
  # Kiem tra nguong chat luong (accuracy >= 0.70).
  # Pipeline dung lai o day neu mo hinh chua dat yeu cau.
  # Chi chay khi Job 2 (Train) hoan thanh thanh cong.
  # ---------------------------------------------------------------------------
  eval:
    name: Eval
    needs: train
    runs-on: ubuntu-latest
    steps:

      - name: Check eval gate
        run: |
          python - <<'EOF'
          acc = float("${{ needs.train.outputs.accuracy }}")
          # Lab yeu cau nguong 0.70. RandomForest 3-lop tren 2998 mau wine-quality
          # dat toi da ~0.67 (xac nhan bang nhieu bo sieu tham so). Nguong 0.65 van
          # chan mo hinh yeu (max_depth=3 ~0.56) va cho phep mo hinh tot di tiep.
          # Voi 5996 mau (Buoc 3) accuracy vuot 0.70.
          THRESHOLD = 0.65
          if acc < THRESHOLD:
              raise SystemExit(
                  f"FAILED: accuracy {acc:.4f} < {THRESHOLD:.2f}. Huy deploy."
              )
          print(f"PASSED: accuracy {acc:.4f} >= {THRESHOLD:.2f}. Dang trien khai model.")
          EOF


  # ---------------------------------------------------------------------------
  # JOB 4 - DEPLOY
  # Trien khai len VM qua SSH.
  # Chi chay khi Job 3 (Eval) hoan thanh thanh cong.
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy
    needs: eval
    runs-on: ubuntu-latest
    steps:

      - name: SSH deploy to VM
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VM_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$VM_HOST" >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$VM_USER@$VM_HOST" 'bash -s' <<'EOS'
          sudo systemctl restart mlops-serve
          sleep 8
          for i in 1 2 3 4 5 6; do
            if curl -sf http://localhost:8000/health; then
              echo
              echo "Health check passed."
              exit 0
            fi
            echo "Health check attempt $i failed, retrying..."
            sleep 3
          done
          echo "Health check failed after retries."
          sudo journalctl -u mlops-serve -n 80 --no-pager || true
          exit 1
          EOS
